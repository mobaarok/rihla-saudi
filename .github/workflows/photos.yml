name: Fetch place photos

# Finds freely licensed photos on Wikimedia Commons for places that don't have one yet,
# and commits them with their credits. Runs when the place list or photo choices change,
# or by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-pick photos for every place
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/data/places/**'
      - 'scripts/fetch-photos.mjs'
      - 'scripts/photo-overrides.json'

permissions:
  contents: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-photos.mjs ${{ inputs.force && '--force' || '' }}
      - name: Commit new photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos src/data/photos.json scripts/photo-candidates.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update place photos from Wikimedia Commons"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
